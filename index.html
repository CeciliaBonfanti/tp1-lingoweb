<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoWeb - Login</title>
    <link rel="stylesheet" href="css/1-variables.css">
    <link rel="stylesheet" href="css/2-layout.css">
    <link rel="stylesheet" href="css/3-botones.css">

    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <main class="contenedor-pagina contenedor-login">
    <!-- Header/Imagotipo de la plataforma -->
    <header class="login-header">
      <h1 class="nav-marca">LingoWeb</h1>
      <p class="texto-chico">Aprende Inglés, Alemán y Chino gratis y de forma divertida</p>
    </header>

    <!-- Tarjeta del Formulario -->
    <section class="tarjeta tarjeta-login">
      <h2>Iniciar Sesión</h2>
      
      <form action="vistas/dashboard.html" method="GET">
        <div class="campo-grupo">
          <label for="usuario">Usuario / Email:</label>
          <input 
            type="text" 
            id="usuario" 
            name="usuario" 
            class="input-control" 
            placeholder="Ej: usuario@unlam.edu.ar"
            required
          >
        </div>

        <div class="campo-grupo">
          <label for="password">Contraseña:</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="input-control" 
            placeholder="••••••••••"
            required
          >
        </div>

        <button type="submit" class="btn btn-primario btn-bloque">
          Iniciar Sesión
        </button>
      </form>

      <!-- Enlaces de navegación solicitados -->
      <footer class="login-enlaces">
        <a href="vistas/recuperar-password.html" class="enlace-secundario">¿Olvidaste tu contraseña?</a>
        <span class="separador">|</span>
        <a href="vistas/registro.html" class="enlace-secundario">Registrarse</a>
      </footer>
    </section>
  </main>
</body>
</html>
