<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoWeb - Lección</title>
    <link rel="stylesheet" href="../css/1-variables.css">
    <link rel="stylesheet" href="../css/2-layout.css">
    <link rel="stylesheet" href="../css/3-botones.css">
    <link rel="stylesheet" href="../css/leccion.css">
</head>
<body>
    <nav class="navbar">
        <a href="dashboard.html"><img src="../imagenes/cancelar.png" alt="Cancelar lección"></a>
        <div class="indicador-idioma">
            <img src="../imagenes/bandera-de.png" alt="Idioma" class="bandera-chica" id="icono-idioma">
            <span class="nav-texto texto-idioma" id="titulo-idioma">Cargando...</span>
        </div>
        <section class="grupo-progreso">
            <progress id="barra-progreso" class="barra-progreso-relleno" value="0" max="100"></progress>
            <span class="nav-texto" id="texto-porcentaje">0%</span>
        </section>

        <section class="grupo-indicador-vida">
            <div class="contenedor-corazones">
                <img src="../imagenes/forma-de-corazon.png" alt="corazon">
            </div>
             <span class="nav-texto" id="contador-vidas">Vidas: 3</span>
        </section>
    </nav>
    
    <main class="contenedor-pagina">
        <section class="area-ejercicio">
             <h2>Traduce la siguiente oración:</h2>
    
            <article class="oracion">
                <!-- Acá JavaScript va a inyectar la oración (ej: "Hello, nice to meet you") -->
                <p id="oracion-original">Cargando oración...</p>
            </article>

            <!-- Este contenedor arranca vacío. Acá van a caer las palabras que el usuario elija -->
            <article class="area-respuesta" id="contenedor-respuesta">
            </article>

            <p>Banco de palabras disponibles:</p>

            <!-- Este contenedor arranca vacío. Acá JavaScript va a crear los botones desordenados -->
            <article class="area-palabras" id="banco-palabras">
            </article>
        </section>
    </main>
    
    <footer class="footer" id="footer-leccion">
        <!-- ESTADO NORMAL -->
        <div id="estado-normal" class="estado-footer estado-normal">
            <button id="btn-comprobar" class="btn btn-primario btn-accion" disabled>Comprobar Respuesta</button>
        </div>

        <!-- ESTADO ÉXITO (Oculto por defecto desde CSS, idealmente) -->
        <div id="estado-exito" class="estado-footer estado-exito">
            <div class="feedback-textos">
                <p class="titulo-exito"><strong>¡Excelente!</strong></p>
                <p class="texto-significado" id="texto-exito">Significado: ...</p>
            </div>
            <button id="btn-continuar-exito" class="btn btn-primario btn-accion">Continuar</button>
        </div>

        <!-- ESTADO ERROR (Oculto por defecto desde CSS) -->
        <div id="estado-error" class="estado-footer estado-error">
            <div class="feedback-textos">
                <p class="titulo-error"><strong>¡Respuesta incorrecta!</strong></p>
                <p class="texto-significado" id="texto-error">Solución: ...</p>
            </div>
            <button id="btn-continuar-error" class="btn btn-error btn-accion">Rehacer</button> 
        </div>
    </footer> 

    <script type="module" src="../js/view/leccion.js"></script>
</body>
</html>
