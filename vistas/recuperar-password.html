<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LingoWeb - Recuperar Contraseña</title>
  
  <!-- Hojas de estilo globales -->
  <link rel="stylesheet" href="../css/1-variables.css">
  <link rel="stylesheet" href="../css/2-layout.css">
  <link rel="stylesheet" href="../css/3-botones.css">
  
  <!-- Estilo reutilizado de login/formularios -->
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>

  <main class="contenedor-pagina contenedor-login">
    <header class="login-header">
      <h1 class="nav-marca">LingoWeb</h1>
      <p class="texto-chico">Recupera el acceso a tu cuenta</p>
    </header>

    <section class="tarjeta tarjeta-login">
      <h2>Recuperar Contraseña</h2>
      <p class="texto-chico" style="margin-bottom: var(--espaciado-grande);">
        Ingresa tu correo electrónico registrado y te enviaremos las instrucciones para restablecer tu clave.
      </p>
      
      <form action="../index.html" method="GET">
        <div class="campo-grupo">
          <label for="email">Correo Electrónico:</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="input-control" 
            placeholder="juan.perez@alumnos.unlam.edu.ar"
            required
          >
        </div>

        <button type="submit" class="btn btn-primario btn-bloque">
          Enviar Instrucciones
        </button>
      </form>

      <footer class="login-enlaces">
        <a href="../index.html" class="enlace-secundario">← Volver al Inicio de Sesión</a>
      </footer>
    </section>
  </main>

</body>
</html>
