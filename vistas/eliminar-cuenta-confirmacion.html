<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LingoWeb - Confirmar Eliminación</title>

    <!-- Hojas de estilo globales -->
    <link rel="stylesheet" href="../css/1-variables.css" />
    <link rel="stylesheet" href="../css/2-layout.css" />
    <link rel="stylesheet" href="../css/3-botones.css" />

    <!-- Estilo específico de la vista -->
    <link rel="stylesheet" href="../css/eliminar-cuenta.css" />
  </head>
  <body>
    <main class="contenedor-pagina contenedor-confirmacion">
      <header class="confirmacion-header">
        <h1 class="nav-marca">LingoWeb</h1>
      </header>

      <section class="tarjeta tarjeta-confirmacion">
        <h2 class="titulo-peligro">¿Eliminar cuenta?</h2>

        <p class="texto-chico mensaje-advertencia">
          ¿Estás seguro de que deseas eliminar tu usuario? Esta acción es
          permanente y perderás todo tu progreso de cursos y estadísticas.
        </p>

        <div class="acciones-confirmacion">
          <a href="registro.html" class="btn btn-primario"> Sí, eliminar </a>
          <a href="perfil.html" class="btn btn-secundario btn-bloque">
            Cancelar
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
