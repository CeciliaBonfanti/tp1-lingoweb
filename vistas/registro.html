<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LingoWeb - Crear Cuenta</title>
  

  <link rel="stylesheet" href="../css/1-variables.css">
  <link rel="stylesheet" href="../css/2-layout.css">
  <link rel="stylesheet" href="../css/3-botones.css">
  
  <!-- Estilo reutilizado de login/formularios -->
  <link rel="stylesheet" href="../css/login.css">
</head>
<body>

  <main class="contenedor-pagina contenedor-login">
    <header class="login-header">
      <h1 class="nav-marca">LingoWeb</h1>
      <p class="texto-chico">Crea tu cuenta para empezar a aprender idiomas gratis</p>
    </header>

    <section class="tarjeta-login">
      <h2>Crear Cuenta</h2>
      
      <form action="dashboard.html" method="get"> <!-- Se cambia post por get a modo de prueba -->
        <div class="campo-grupo">
          <label for="nombre">Nombre Completo:</label>
          <input 
            type="text" 
            id="nombre" 
            name="nombre" 
            class="input-control" 
            placeholder="Ej: Juan Pérez"
            required
          >
        </div>

        <div class="campo-grupo">
          <label for="usuario">Nombre de Usuario:</label>
          <input 
            type="text" 
            id="usuario" 
            name="usuario" 
            class="input-control" 
            placeholder="Ej: juanperez_web"
            required
          >
        </div>

        <div class="campo-grupo">
          <label for="email">Correo Electrónico:</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="input-control" 
            placeholder="juan.perez@alumnos.unlam.edu.ar"
            required
          >
        </div>

        <div class="campo-grupo">
          <label for="password">Contraseña:</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="input-control" 
            placeholder="Mínimo 8 caracteres"
            required
          >
        </div>

        <button type="submit" class="btn btn-primario btn-bloque">
          Registrarme
        </button>
      </form>

      <footer class="login-enlaces">
        <span class="texto-chico">¿Ya tienes cuenta?</span>
        <a href="../index.html" class="enlace-secundario">Inicia sesión aquí</a>
      </footer>
    </section>
  </main>

</body>
</html>
