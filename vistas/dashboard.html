<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoWeb - Dashboard</title>
    <link rel="stylesheet" href="../css/1-variables.css">
    <link rel="stylesheet" href="../css/2-layout.css">
    <link rel="stylesheet" href="../css/3-botones.css">
    <link rel="stylesheet" href="../css/dashboards.css">
</head>

<body>

    <!-- BARRA DE NAVEGACIÓN PRINCIPAL -->
    <nav class="navbar">
        <a href="dashboard.html" class="nav-marca">LingoWeb</a>
        <ul class="nav-enlaces">
            <li><a href="dashboard.html" class="activo">Cursos</a></li>
            <li><a href="perfil.html">Perfil</a></li>
            <li><a href="ranking.html">Ranking</a></li>
            <li><a href="tienda.html">Tienda</a></li>
            <li><a href="racha.html" id="nav-racha">🔥 -- Días</a></li>
            <li><a href="tienda.html" id="nav-xp" title="Canjear XP en la Tienda">⚡ -- XP</a></li>
        </ul>
    </nav>

    <!-- CONTENEDOR PRINCIPAL -->
    <main class="contenedor-pagina">
        <h1>Mis Cursos de Idiomas</h1>

        <div class="dashboard-layout">

            <!-- SECCIÓN DE SELECCIÓN DE IDIOMAS (COLUMNA IZQUIERDA) -->
            <section class="grilla-tarjetas" aria-live="polite">
                <!-- Se puebla dinámicamente desde cursos.js -->
            </section>

            <!-- SECCIÓN LATERAL DE RESUMEN (COLUMNA DERECHA) -->
            <aside class="sidebar-estadisticas">
                <div class="tarjeta tarjeta-stats">
                    <h3>Tu Progreso</h3>

                    <div class="stat-item">
                        <span class="stat-icon">🎓</span>
                        <div>
                            <span class="stat-label">Lecciones</span>
                            <strong id="stat-lecciones">0 superadas</strong>
                        </div>
                    </div>

                    <div class="stat-item">
                        <span class="stat-icon">❤️</span>
                        <div>
                            <span class="stat-label">Vidas</span>
                            <strong id="stat-vidas">3 / 3</strong>
                        </div>
                    </div>
                </div>
            </aside>

        </div>
    </main>
    <script type="module" src="../js/view/cursos.js"></script>
</body>
</html>
