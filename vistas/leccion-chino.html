<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoWeb - Lección de Chino</title>
    <link rel="stylesheet" href="../css/1-variables.css">
    <link rel="stylesheet" href="../css/2-layout.css">
    <link rel="stylesheet" href="../css/3-botones.css">

    <link rel="stylesheet" href="../css/leccion.css">
</head>
<body>
    <nav class="navbar">
        <a href="mapa.html"><img src="../imagenes/cancelar.png" alt="Cancelar lección"></a>
        <section class="grupo-progreso">
            <div class="barra-progreso-contenedor">
                <div class="barra-progreso-relleno progreso-60"></div>
            </div>
            <span class="nav-texto">60%</span>
        </section>

        <section class="grupo-indicador-vida">
            <div class="contenedor-corazones">
                <img src="../imagenes/forma-de-corazon.png" alt="corazon">
                <img src="../imagenes/forma-de-corazon.png" alt="corazon">
                <img src="../imagenes/forma-de-corazon.png" alt="corazon">
            </div>
             <span class="nav-texto">Vidas: 3</span>
        </section>
    </nav>
    <main class="contenedor-pagina">
        <section class="area-ejercicio">
             <h2>Traduce la siguiente oración:</h2>
    
            <article class="oracion">
                <p>"Wǒ xǐhuan hē kāfēi" 🔊</p>
            </article>

            <article class="area-respuesta">
                <span class="palabra">Me</span>
                <span class="palabra">gusta</span>
                <span class="palabra">tomar</span>
                <span class="palabra">café</span>
            </article>

            <p>Banco de palabras disponibles:</p>

            <article class="area-palabras">
                <span class="palabra">no</span>
                <span class="palabra">agua</span>
                <span class="palabra">café</span>
                <span class="palabra">gusta</span>
                <span class="palabra">tomar</span>
                <span class="palabra">comer</span>
                <span class="palabra">Me</span>
            </article>
        </section>
    </main>
    <footer class="footer" id="footer-leccion">
    
        <!-- ESTADO NORMAL -->
        <div class="estado-footer estado-normal">
            <a href="#estado-exito" class="btn btn-primario btn-accion">Comprobar Respuesta</a>
        </div>

        <!-- ESTADO ÉXITO -->
        <div id="estado-exito" class="estado-footer estado-exito">
            <div class="feedback-textos">
                <p class="titulo-exito"><strong>¡Excelente!</strong></p>
                <p class="texto-significado">Significado: Me gusta tomar café</p>
            </div>
            <a href="#" class="btn btn-primario btn-accion">Continuar</a>
        </div>

        <!-- ESTADO ERROR -->
        <div id="estado-error" class="estado-footer estado-error">
            <div class="feedback-textos">
                <p class="titulo-error"><strong>¡Respuesta incorrecta!</strong></p>
                <p class="texto-significado">Me gusta tomar café</p>
            </div>
            <a href="#" class="btn btn-error btn-accion">Continuar</a> 
        </div>
    </footer>
</body>
</html>
